<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuoTalk — Legal</title>
<style>
  :root { --gold:#B07A1E; --ink:#1c1814; --muted:#6b6258; --line:#e7e0d4; --bg:#faf7f1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; padding:72px 22px 80px; }
  .brand { font-size:13px; letter-spacing:2px; text-transform:uppercase;
    color:var(--gold); font-weight:700; }
  h1 { font-size:30px; margin:6px 0 8px; }
  p { margin:0 0 26px; color:var(--muted); }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.card { display:block; padding:16px 18px; border:1px solid var(--line);
    border-radius:12px; text-decoration:none; color:var(--ink); font-weight:600;
    background:#fff; }
  a.card:hover { border-color:var(--gold); }
  footer { margin-top:40px; color:var(--muted); font-size:13px; }
  footer a { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">GuoTalk</div>
  <h1>Legal</h1>
  <p>Order hotpot like a local. Then everything else.</p>
  <div class="links">
    <a class="card" href="privacy_policy.html">Privacy Policy &rarr;</a>
    <a class="card" href="terms_of_service.html">Terms of Service &rarr;</a>
  </div>
  <footer>Contact: <a href="mailto:guotalk2026@gmail.com">guotalk2026@gmail.com</a></footer>
</div>
</body>
</html>
